# Route10 VPN Project Configuration
# Edit this file to override default runtime settings.

# Runtime namespace prefix (used in tmp paths and generated hotplug names)
VPN_PREFIX="vpnx1"

# Auto-allocation range for routing tables used by this project.
# Keep this range isolated from other VPN managers on the router.
VPN_RT_START=1000
VPN_RT_END=1499

# SQLite busy timeout (milliseconds) for concurrent commit/hotplug writers.
# Default requested for migration parity.
PBR_DB_BUSY_TIMEOUT_MS=5000

# Default IPv6 behavior for new interfaces:
# - nat66: existing behavior (NAT66 for provider-style host IPv6)
# - routed-prefix: delegated /64 client-routing mode (no NAT66)
# - disabled: force IPv4-only behavior for managed targets
VPN_IPV6_MODE_DEFAULT="nat66"

# Routed-prefix verification tuning.
VPN_IPV6_ROUTED_VERIFY_TIMEOUT_SEC=5
VPN_IPV6_ROUTED_VERIFY_RETRIES=3
VPN_IPV6_ROUTED_PROBE_ADDR="2606:4700:4700::1111"

# If 0, routed-prefix setup refuses to overwrite existing downstream RA/DHCPv6
# ownership that was not previously captured by this project.
VPN_IPV6_FORCE_TAKEOVER=0

# Legacy alias (kept for compatibility with migrated naming)
WG_DB_BUSY_TIMEOUT_MS="$PBR_DB_BUSY_TIMEOUT_MS"

# Auto-update settings for route10-vpn-client scripts/rules.
# 0 = disabled, 1 = enabled (default)
VPN_ENABLE_AUTO_UPDATE=1

# Daily updater cron schedule.
VPN_UPDATE_CRON="40 4 * * *"

# Supply-chain trust anchor for updates.
# When set (64 hex chars), an update is applied only if the release archive
# hashes to this value. This file is preserved across updates, so a
# compromised release cannot rewrite the pin. When empty, the digest comes
# from the release's SHA256SUMS and the update is still gated on the detached
# signature below (and on SLSA provenance unless VPN_UPDATE_ALLOW_UNVERIFIED
# is 1).
VPN_UPDATE_PINNED_SHA256=""

# 1 = apply updates without provenance verification (not recommended).
VPN_UPDATE_ALLOW_UNVERIFIED=0

# Every release must carry a detached signature (<asset>.sig) from the release
# signing key. The public key is the VPN_UPDATE_PUBKEY PEM below; this file is
# preserved across updates, so a bad release cannot replace the key. A
# device-local conf/release-pub.pem is accepted as a fallback, but the release
# archive never ships one. Signature verification cannot be disabled and is
# not affected by VPN_UPDATE_ALLOW_UNVERIFIED.


# Release signing public key (PEM). The matching private key never leaves
# your offline workstation; see SUPPLY_CHAIN.md. This file is preserved across
# updates, so a compromised release cannot replace the key that validates it.
VPN_UPDATE_PUBKEY='-----BEGIN PUBLIC KEY-----
MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAELyn0PHaSpMOo8qIBgeV96nli7bNx
AH3qN/aMP6LOhu90uPJkwSevhyhf6autDH9jMHb/k84BaEJ6IuKOeSUTJw==
-----END PUBLIC KEY-----'
