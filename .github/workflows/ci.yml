name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Shell syntax and validation matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(git ls-files '*.sh')
          for file in "${shell_files[@]}"; do
            echo "bash -n $file"
            bash -n "$file"
          done

      - name: Verify vendored signature verifier digest
        shell: bash
        run: |
          set -euo pipefail
          cd lib/vendor
          sha256sum -c route10-signature.sh.sha256

      # project.conf is preserved across updates, so a release can never repair
      # a missing key: the devices just stop verifying, permanently.
      - name: Verify the update trust anchor is present
        shell: bash
        run: |
          set -euo pipefail
          sh -c '. ./project.conf; printf "%s\n" "${VPN_UPDATE_PUBKEY:-}"' > /tmp/trust-anchor.pem
          if [ ! -s /tmp/trust-anchor.pem ]; then
            echo "ERROR: VPN_UPDATE_PUBKEY is empty in project.conf" >&2
            exit 1
          fi
          if ! openssl pkey -pubin -in /tmp/trust-anchor.pem -noout; then
            echo "ERROR: VPN_UPDATE_PUBKEY is not a valid PEM public key" >&2
            exit 1
          fi
          echo "update trust anchor present and parses"

      - name: Run validation matrix
        shell: bash
        run: sh tests/validation-matrix-test.sh

      # `/bin/sh` is dash on this runner, but say so explicitly: the generated
      # hotplug scripts are executed directly through their shebang, and dash
      # rejects shell features BusyBox ash accepts.
      - name: Run validation matrix under dash
        shell: bash
        run: |
          set -euo pipefail
          command -v dash >/dev/null 2>&1 || { echo "dash is required" >&2; exit 1; }
          dash tests/validation-matrix-test.sh
