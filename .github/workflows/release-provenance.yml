name: SLSA Provenance

on:
  release:
    types:
      - published
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and checksum release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(git ls-files '*.sh')
          for file in "${shell_files[@]}"; do
            echo "bash -n $file"
            bash -n "$file"
          done

      - name: Build release archive
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="manual-${GITHUB_SHA::12}"
          fi
          name="${GITHUB_REPOSITORY##*/}-${version}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${name}/" -o "dist/${name}.tar.gz" "${GITHUB_SHA}"
          (
            cd dist
            sha256sum "${name}.tar.gz" > SHA256SUMS
          )
          echo "archive_name=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          sha256sum dist/*

      # The release archive is built with `git archive`, which ships tracked
      # files only. An untracked vendored verifier would be silently omitted
      # and every device would refuse the update, so fail before publishing.
      - name: Verify release archive contains the vendored verifier
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.build.outputs.archive_name }}"
          # List to a file first: `grep -q` exits at the first match, which
          # SIGPIPEs tar, and pipefail then reports a present file as missing.
          tar -tzf "dist/${archive}" > "${RUNNER_TEMP}/archive-listing.txt"
          if ! grep -q '/lib/vendor/route10-signature\.sh$' "${RUNNER_TEMP}/archive-listing.txt"; then
            echo "ERROR: ${archive} is missing lib/vendor/route10-signature.sh" >&2
            echo "Commit the vendored verifier before tagging a release." >&2
            exit 1
          fi
          echo "vendored verifier present in ${archive}"

      - name: Generate SLSA subject
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.build.outputs.archive_name }}"
          hashes="$(cd dist && sha256sum "$archive" | base64 -w0)"
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  provenance:
    name: Generate SLSA provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      private-repository: ${{ github.event.repository.private }}
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}

  release:
    name: Publish release artifacts
    needs: [build, provenance]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      # The release is created as a draft on purpose: the archive is not
      # downloadable by devices until a human signs it and publishes, so a
      # release cannot go live without a signature.
      - name: Create draft release with assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset="${GITHUB_REPOSITORY##*/}-${tag}.tar.gz"

          notes_args=(--generate-notes)
          if [ -f "docs/releases/${tag}.md" ]; then
            notes_args=(--notes-file "docs/releases/${tag}.md")
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            have="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$have" | grep -qxF "$asset"; then
              echo "Release $tag already carries $asset; leaving it untouched."
              exit 0
            fi
            # The SLSA generator creates and publishes the release itself when
            # it uploads provenance, so turn that into the draft the signing
            # step expects instead of assuming we created it.
            echo "Release $tag exists but has no archive; attaching it and going back to draft."
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --draft "${notes_args[@]}"
          else
            gh release create "$tag" dist/* --draft --title "$tag" "${notes_args[@]}"
          fi

          echo "Draft release $tag is ready. Sign the asset, then publish:"
          echo "  ./scripts/sign-release-asset.sh $tag"
          echo "  gh release edit $tag --draft=false"
